name: Contribution Graph

on:
  schedule: # 18:00 UTC daily — the 30-day window moves every day
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contrib-graph.yaml
      - tools/render-profile.mjs

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    name: render-profile-graphic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No third-party action and no dependencies: the renderer lives in this
      # repo, so nothing external executes with the write-scoped token.
      - name: Render profile graphic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/render-profile.mjs --user "${{ github.repository_owner }}"

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/contrib-graph
          if git diff --staged --quiet; then
            echo "No change to the graphic."
          else
            git commit -m "chore: refresh profile graphic"
            git push
          fi
